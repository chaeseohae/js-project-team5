<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="my-reports.css">
</head>
<body>
    <div class="side-panel">
        <h1>나의 신고내역</h1>
        <div class="reports-wrapper">
            <div class="status-filter">
                <button class="filter-btn active" data-status="all" data-label="전체">전체</button>
                <button class="filter-btn" data-status="pending" data-label="신고 접수">신고 접수</button>
                <button class="filter-btn" data-status="processing" data-label="처리 중">처리 중</button>
                <button class="filter-btn" data-status="done" data-label="처리 완료">처리 완료</button>
            </div>

            <div class="sort-container">
                <select class="sort-select" id="sortSelect">
                    <option value="newest">최신순</option>
                    <option value="oldest">오래된순</option>
                </select>
            </div>

            <div class="my-reports-container"></div>
        </div>
    </div>

<script src="https://kit.fontawesome.com/de1bcb514f.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="my-reports.js"></script>
</body>
</html>
