<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="guide.css">
</head>
<body>
    <!-- 창 전체 우측 상단 닫기 버튼 -->
    <button
      type="button"
      class="panel-close-btn"
      id="btn-close-guide"
      aria-label="가이드 창 닫기"
    >
      ×
    </button>

    <div class="side-panel">
        <h1>올바른 주차 가이드</h1>
        <div class="panel-view active" data-view="guide">
            <section class="guide-section do">
                <h3>✅ 주차 가능 공간</h3>

                <div class="guide-card">
                    <img src="images/do1.jpg" alt="">
                    <p>전용 거치대를 이용해 주세요.</p>
                </div>

                <div class="guide-card">
                    <img src="images/do2.jpg" alt="">
                    <p>건물 벽면이나 구조물 옆에 붙여 주차해 주세요.</p>
                </div>
            </section>

            <section class="guide-section dont">
                <h3>❌ 이렇게 하면 안 돼요</h3>

                <div class="guide-card">
                    <img src="images/dont1.jpg" alt="">
                    <p>횡단보도 앞을 가로막지 마세요.</p>
                </div>

                <div class="guide-card">
                    <img src="images/dont2.jpg" alt="">
                    <p>점자블록 위에는 주차할 수 없습니다.</p>
                </div>

                <div class="guide-card">
                    <img src="images/dont3.jpg" alt="">
                    <p>보도블록 중앙은 비워 주세요.</p>
                </div>
            </section>
        </div>
    
    
    </div>

    








<script src="https://kit.fontawesome.com/de1bcb514f.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="guide.js"></script>
</body>
</html>
