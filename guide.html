<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="guide.css">
</head>
<body>
    <div class="container">
        <h1>올바른 주차 가이드</h1>
        <h3>✅주차 가능 공간✅</h3>
        <div class="parking-do">
            <div class="card" style="width: 18rem;">
                <img src="images/do1.jpg" class="card-img-top">
                <div class="card-body">
                    <p class="card-text">전용 거치대를 이용해 주세요.</p>
                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <img src="images/do2.jpg" class="card-img-top">
                <div class="card-body">
                    <p class="card-text">구조물 옆에 주차해 주세요.</p>
                </div>
            </div>
        </div>
        <h3>❌이렇게 하면 안 돼요❌</h3>
        <div class="parking-dont">
            <div class="card" style="width: 18rem;">
                <img src="images/dont1.jpg" class="card-img-top">
                <div class="card-body">
                    <p class="card-text">횡단보도 앞을 가로막으면 안 돼요.</p>
                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <img src="images/dont2.jpg" class="card-img-top">
                <div class="card-body">
                    <p class="card-text">점자블록 위에 주차하면 안 돼요.</p>
                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <img src="images/dont3.jpg" class="card-img-top">
                <div class="card-body">
                    <p class="card-text">보도블럭 가운데는 비워주세요.</p>
                </div>
            </div>
        </div>
    
    
    </div>

    








<script src="https://kit.fontawesome.com/de1bcb514f.js" crossorigin="anonymous"></script>

<script src="guide.js"></script>
</body>
</html>
